<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const segment = 1;
      const path = window.location.pathname;
      const base = path.split("/").slice(0, segment + 1).join("/");
      const rest = path.split("/").slice(segment + 1).join("/");
      const query = window.location.search;
      const hash = window.location.hash;

      sessionStorage.redirect = base + "/" + rest + query + hash;
    </script>
    <meta http-equiv="refresh" content="0;url=/" />
  </head>
  <body></body>
</html>
