
<!doctype html>
<html lang="ja">
  <head>
    <!-- 文字コードをUTF-8に設定 -->
    <meta charset="UTF-8" />

    <!-- サイトのファビコンを設定 -->
    <link rel="icon" type="image/svg+xml" href="/test-studyquest/favicon.svg" />

    <!-- GitHub Pages リロード対応 -->
    <script>
      (function () {
        // 404.html から保存された元のURLを取得
        const redirect = sessionStorage.redirect;

        // 保存されたURLを削除（二重適用を防止）
        delete sessionStorage.redirect;

        // 保存されたURLがあり、現在のURLと異なる場合
        if (redirect && redirect !== window.location.href) {
          // ブラウザの履歴を書き換えて元のURLを復元
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <!-- ビューポートを設定（スマートフォンなどの画面サイズに対応） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ブラウザのタブに表示するタイトル -->
    <title>my-games</title>
    <script type="module" crossorigin src="/test-studyquest/assets/index-DHJmYOiP.js"></script>
    <link rel="stylesheet" crossorigin href="/test-studyquest/assets/index-DrO6vkvy.css">
  </head>

  <body>
    <!-- Reactアプリケーションを描画する領域 -->
    <div id="root"></div>

    <!-- Reactのエントリーポイント（main.tsx）を読み込む -->
  </body>
</html>
